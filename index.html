  function onFail(err) {
    var msg = String(err && err.message || err);
    if (msg.indexOf('EXPIRED') >= 0 || msg.indexOf('NO_ACCESS') >= 0) {
      try { window.top.postMessage('suwon-registry-expired', '*'); } catch (e) {}
      screen.innerHTML = '<div class="msg-page"><div class="msg-card"><h1 class="msg-title">다시 들어와 주십시오</h1>' +
        '<p class="msg-body">출입 시간이 지났습니다. 홈 화면의 교적부 아이콘으로 다시 여십시오.</p></div></div>';
    } else {
      screen.innerHTML = '<div class="loading">자료를 불러오지 못했습니다. 잠시 후 다시 여십시오.</div>';
    }
  }

  // ── 사진: 보이는 것만 불러옴 (F-07) ──
  var pending = {}, timer = null;
  var observer = 'IntersectionObserver' in window ? new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (!e.isIntersecting) return;
      observer.unobserve(e.target);
      want(e.target.dataset.photo, e.target.dataset.size || 'sm');
    });
  }, { rootMargin: '200px' }) : null;

  function want(id, size) {
    var k = id + '|' + size;
    if (photos[k]) return paint(id, size);
    pending[size] = pending[size] || {};
    pending[size][id] = true;
    clearTimeout(timer);
    timer = setTimeout(flush, 60);
  }

  function flush() {
    Object.keys(pending).forEach(function (size) {
      var ids = Object.keys(pending[size]);
      delete pending[size];
      for (var i = 0; i < ids.length; i += 30) {
        (function (chunk) {
          google.script.run.withSuccessHandler(function (got) {
            Object.keys(got || {}).forEach(function (id) { photos[id + '|' + size] = got[id]; paint(id, size); });
          }).apiPhotos(TOKEN, chunk, size);
        })(ids.slice(i, i + 30));
      }
    });
  }

  function paint(id, size) {
    var url = photos[id + '|' + size];
    if (!url) return;
    document.querySelectorAll('[data-photo="' + id + '"][data-size="' + size + '"]').forEach(function (el) {
      el.classList.remove('is-loading');
      var img = el.querySelector('img');
      if (img && img.getAttribute('src') === url) return;
      if (img) {
        // 이미 작은 사진이 보이면 새로 그리지 않고, 큰 사진을 다 받은 뒤 조용히 바꾼다 (깜빡임 없앰, 2026-11-03)
        var pre = new Image();
        pre.onload = function () { img.src = url; };
        pre.src = url;
        return;
      }
      el.innerHTML = '<img alt="" class="fade" src="' + url + '">';
    });
  }

  /** 목록을 연 뒤 남은 작은 사진을 조금씩 미리 받아 둔다 (스크롤할 때 바로 보이게) */
  var prefetchStarted = false;
  function prefetchPhotos() {
    if (prefetchStarted || !D) return;
    prefetchStarted = true;
    var ids = D.members.slice().sort(byName).map(function (m) { return m.photoId; })
      .filter(function (id) { return id && !photos[id + '|sm']; });
    (function next() {
      var chunk = ids.splice(0, 40).filter(function (id) { return !photos[id + '|sm']; });
      if (!chunk.length) { if (ids.length) next(); return; }
      google.script.run.withSuccessHandler(function (got) {
        Object.keys(got || {}).forEach(function (id) { photos[id + '|sm'] = got[id]; paint(id, 'sm'); });
        if (ids.length) setTimeout(next, 200);
      }).withFailureHandler(function () {}).apiPhotos(TOKEN, chunk, 'sm');
    })();
  }

  function wirePhotos() {
    document.querySelectorAll('[data-photo]').forEach(function (el) {
      // 큰 사진 자리에 작은 사진이 임시로 들어 있어도, 큰 사진은 따로 받아 바꿔 끼운다
      if (photos[el.dataset.photo + '|' + el.dataset.size]) return paint(el.dataset.photo, el.dataset.size);
      if (observer) observer.observe(el); else want(el.dataset.photo, el.dataset.size);
    });
  }

  // ── 그리기 도우미 ──
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  var PERSON = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="9" r="4.2"/><path d="M3.8 21c.8-4.3 4.1-6.8 8.2-6.8s7.4 2.5 8.2 6.8z"/></svg>';

  /** 사진: 없으면 사람 아이콘, 있으면 불러오는 동안 반짝임 표시 (2026-11-02) */
  function avatar(name, photoId, cls, size) {
    size = size || 'sm';
    if (!photoId) return '<div class="avatar noimg ' + (cls || '') + '">' + PERSON + '</div>';
    var have = photos[photoId + '|' + size] || (size === 'lg' && photos[photoId + '|sm']);
    return '<div class="avatar ' + (have ? '' : 'is-loading ') + (cls || '') + '" data-photo="' + esc(photoId) + '" data-size="' + size + '">' +
      (have ? '<img alt="" src="' + have + '">' : '') + '</div>';
  }

  function statusTag(m) {
    if (!ADMIN || !m.status || m.status === '출석') return '';
    return '<span class="status-tag' + (m.status === '확인필요' ? ' check' : '') + '">' + esc(m.status === '확인필요' ? '출석 확인필요' : m.status) + '</span>';
  }

  /** 목록 한 줄: AS Ver1처럼 「성명 신명 · 직책」을 크게, 둘째 줄에 소속 (§5.2) */
  /** 목록 한 줄: 첫 줄 「성명 신명 · 직책」(+상태), 둘째 줄 소속. 직책과 겹치는 소속은 뺀다 */
  function rowHtml(m) {
    var groups = m._groups.filter(function (g) {
      if (!m.title) return true;
      if (g === '교회위원' && m.title.indexOf('교회위원') === 0) return false;  // 직책과 겹치는 소속은 뺀다
      if (g === '사목단' && titleRank(m) <= 4) return false;
      return true;
    });
    var sub = groups.join(' · ');
    return '<button class="row" data-go="' + m.key + '">' +
      avatar(m.name, m.photoId) +
      '<div class="row-main">' +
        '<div class="row-top"><div class="row-name">' + esc(m.name) + (m.saint ? '<span class="row-saint">' + esc(m.saint) + '</span>' : '') +
          (m.title ? '<span class="row-title"> · ' + esc(m.title) + '</span>' : '') + '</div>' +
          statusTag(m) + '</div>' +
        (sub ? '<div class="row-sub"><span class="txt">' + esc(sub) + '</span></div>' : '') +
      '</div>' +
    '</button>';
  }

  function chevron() {
    return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>';
  }

  // ── 교우 목록 (§5.2) ──
  function filtered() {
    var q = norm(state.q);
    var cho = isChosungOnly(q);
    return D.members.filter(function (m) {
      if (ADMIN && state.status !== '전체' && m.status !== state.status) return false;
      if (state.sex === '남성' && m.sex !== '남') return false;
      if (state.sex === '여성' && m.sex !== '여') return false;
      if (state.sex === '확인필요' && (m.sex === '남' || m.sex === '여')) return false;  // 성별이 비었거나 남·여가 아닌 분
      if (state.group === TITLED) { if (!m.title) return false; }
      else if (state.group === NOGROUP) { if (m.service.length || m.small.length || m.cecil) return false; }
      else if (state.group && !inGroup(m, state.group)) return false;
      if (state.talent === TALENT_ALL) { if (!(m.talent || []).length) return false; }
      else if (state.talent && !(m.talent || []).some(function (t) { return talentField(t) === state.talent; })) return false;
      if (!q) return true;
      return cho ? m._cho.indexOf(q) >= 0 : m._hay.indexOf(q) >= 0;
    });
  }

  var TALENT_ALL = '달란트 보유자 전체';
  function talentField(t) { return String(t || '').replace(/\(.*\)/, '').trim(); }
  /** 달란트 분야 목록과 인원 (많은 순) */
  function talentFields() {
    var c = {};
    D.members.forEach(function (m) {
      var seen = {};
      (m.talent || []).forEach(function (t) { var f = talentField(t); if (f && !seen[f]) { seen[f] = 1; c[f] = (c[f] || 0) + 1; } });
    });
    return Object.keys(c).sort(function (a, b) { return c[b] - c[a] || a.localeCompare(b, 'ko'); }).map(function (f) { return [f, c[f]]; });
  }
  function openTalentPicker() {
    var el = document.createElement('div');
    el.className = 'sheet-back';
    el.innerHTML = '<div class="sheet" role="dialog" aria-label="달란트 고르기">' +
      '<div class="sheet-head"><span>달란트 목록에서 고르기</span><button class="sheet-close" data-close="1" aria-label="닫기">✕</button></div>' +
      '<div class="sheet-body"><div class="sheet-chips">' +
      '<button class="pick' + (state.talent === TALENT_ALL ? ' on' : '') + '" data-tpick="' + TALENT_ALL + '">' + TALENT_ALL + ' ' +
        D.members.filter(function (m) { return (m.talent || []).length; }).length + '</button></div>' +
      '<div class="sheet-title">분야</div><div class="sheet-chips">' + talentFields().map(function (f) {
        return '<button class="pick' + (state.talent === f[0] ? ' on' : '') + '" data-tpick="' + esc(f[0]) + '">' + esc(f[0]) + ' ' + f[1] + '</button>';
      }).join('') + '</div></div></div>';
    el.addEventListener('click', function (ev) {
      var t = ev.target.closest('[data-tpick],[data-close]');
      if (ev.target === el || (t && t.dataset.close)) { el.remove(); return; }
      if (t && t.dataset.tpick) { ev.stopPropagation(); state.talent = t.dataset.tpick; el.remove(); renderList(); }
    });
    document.body.appendChild(el);
  }

  /** 단체 고르기 판 (아이폰 기본 펼침 목록 대신, 묶음 제목을 잘 보이게) */
  function pickerSections() {
    return [
      { title: '', items: [['', '전체'], [NOGROUP, '무소속 (연령단체 외 소속 無)']] },
      { title: '섬기는 이들', items: [['사목단', '사목단'], ['교회위원', '교회위원회'], [TITLED, '직책 섬김이']] },
    ].concat(kindCards().filter(function (c) { return c.names.length; }).map(function (c) {
      return { title: c.kind, items: c.names.map(function (n) { return [n, (c.kind === '세실대' ? '세실대 ' : '') + shown(n)]; }) };
    }));
  }

  function groupLabel(v) {
    var found = '';
    pickerSections().forEach(function (sec) { sec.items.forEach(function (it) { if (it[0] === v) found = it[1]; }); });
    return found || '전체';
  }

  function openPicker() {
    var el = document.createElement('div');
    el.className = 'sheet-back';
    el.innerHTML = '<div class="sheet" role="dialog" aria-label="단체 고르기">' +
      '<div class="sheet-head"><span>단체 고르기</span><button class="sheet-close" data-close="1" aria-label="닫기">✕</button></div>' +
      '<div class="sheet-body">' + pickerSections().map(function (sec) {
        return (sec.title ? '<div class="sheet-title">' + esc(sec.title) + '</div>' : '') +
          '<div class="sheet-chips">' + sec.items.map(function (it) {
            return '<button class="pick' + (state.group === it[0] ? ' on' : '') + '" data-pick="' + esc(it[0]) + '">' + esc(it[1]) + '</button>';
          }).join('') + '</div>';
      }).join('') + '</div></div>';
    el.addEventListener('click', function (ev) {
      var t = ev.target.closest('[data-pick],[data-close]');
      if (ev.target === el || (t && t.dataset.close)) { el.remove(); return; }
      if (t && t.dataset.pick !== undefined) {
        ev.stopPropagation();
        state.group = t.dataset.pick;
        el.remove();
        renderList();
      }
    });
    document.body.appendChild(el);
  }

  function segRow(label, field, opts) {
    return '<div class="seg-row"><span class="seg-label">' + label + '</span><div class="seg">' +
      opts.map(function (o) {
        return '<button class="' + (state[field] === o ? 'on' : '') + '" data-cond="' + field + '=' + o + '">' + o + '</button>';
      }).join('') + '</div></div>';
  }

  /** 검색창은 한 번만 그리고, 글자를 칠 때는 아래 결과만 바꾼다 (한글 조합이 끊기지 않게). */
  var LIST_ICON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>';
  function renderList() {
    var html = '<header class="hero">' + brand('교우 검색') +
      '<label class="search">' + iconSearch(18) +
      '<input id="q" type="search" placeholder="이름, 신명, 단체, 직책으로 찾기" value="' + esc(state.q) + '" autocomplete="off">' +
      '<button class="clear" data-clear="1" aria-label="지우기"' + (state.q ? '' : ' hidden') + '>✕</button>' +
      '</label></header>';

    if (ADMIN && D.warnings.length) {
      html += '<div class="warn-box">' + D.warnings.map(esc).join('<br>') + '</div>';
    }

    // 조건 (모두 AND): 출결 · 성별 · 직책 · 단체
    html += '<div class="conds">';
    if (ADMIN) html += segRow('출결', 'status', ['전체', '출석', '비출석', '확인필요']);
    html += segRow('성별', 'sex', ['전체', '남성', '여성', '확인필요']);
    html += '<div class="seg-row"><span class="seg-label">단체</span>' +
      // 2026-11-03 Francis님: 「전체」만 보이면 고를 게 없어 보인다 → 목록을 여는 단추로
      (state.group
        ? '<button class="grp-btn on" data-picker="1">' + LIST_ICON + '<span>' + esc(groupLabel(state.group)) + '</span><span class="grp-more">바꾸기</span></button>' +
          '<button class="grp-x" data-grpx="1" aria-label="단체 조건 풀기">✕</button>'
        : '<button class="grp-btn" data-picker="1">' + LIST_ICON + '<span>단체 목록에서 고르기</span><span class="grp-more">›</span></button>') +
      '</div>';
    // 달란트 조건 (관리자만, 2026-11-03 Francis님): 「음악(기타)」은 분야 「음악」으로 묶어 고른다
    if (ADMIN && talentFields().length) html += '<div class="seg-row"><span class="seg-label">달란트</span>' +
      (state.talent
        ? '<button class="grp-btn on" data-tpicker="1">' + LIST_ICON + '<span>' + esc(state.talent) + '</span><span class="grp-more">바꾸기</span></button>' +
          '<button class="grp-x" data-tx="1" aria-label="달란트 조건 풀기">✕</button>'
        : '<button class="grp-btn" data-tpicker="1">' + LIST_ICON + '<span>달란트 목록에서 고르기</span><span class="grp-more">›</span></button>') +
      '</div>';
    html += '</div>';

    html += '<div id="results">' + resultsHtml() + '</div>';
    html += '<div class="refresh-line"><button data-refresh="1">새로 고침</button>' +
      (ADMIN && bootEl.dataset.build ? '<span class="build">' + esc(verLabel(bootEl.dataset.build)) + '</span>' : '') + '</div>';
    screen.innerHTML = html;

    var input = document.getElementById('q');
    var clear = screen.querySelector('[data-clear]');
    input.addEventListener('input', function () {
      state.q = input.value;
      clear.hidden = !state.q;
      updateResults();
    });
    wirePhotos();
  }

  function updateResults() {
    var box = document.getElementById('results');
    if (!box) return;
    box.innerHTML = resultsHtml();
    wirePhotos();
  }

  function resultsHtml() {
    var list = filtered();
    var label = state.status === '출석' || !ADMIN ? '출석 교우' : (state.status === '전체' ? '교적 전체' : state.status + ' 교우');
    var narrowed = state.q || state.sex !== '전체' || state.group || state.talent;
    var html = '<div class="count">' + (narrowed ? '조건에 맞는 ' : '') + label + ' ' + list.length + '명' +
      (narrowed ? ' <button class="reset" data-reset="1">조건 지우기</button>' : '') + '</div>';
    if (!list.length) return html + '<div class="list"><div class="empty">조건에 맞는 교우가 없습니다.</div></div>';
    var g = state.group ? groupInfo(state.group) : null;
    list.sort(function (a, b) {
      if (state.group === TITLED || state.group === '사목단' || state.group === '교회위원') return titleRank(a) - titleRank(b) || byName(a, b);
      if (state.group && state.group !== NOGROUP) return isLeader(b, g && g.leader, state.group) - isLeader(a, g && g.leader, state.group) || byName(a, b);
      return byName(a, b);
    });
    html += '<div class="list">' + list.map(rowHtml).join('') + '</div>';
    return html + familyOfMatches(list);
  }

  /** 이름(신명)으로 찾았으면 그 교우의 가족도 아래에 함께 보여 준다 (2026-11-02 Francis님).
      단체·직책 이름으로 찾은 경우에는 붙이지 않는다. */
  function familyOfMatches(list) {
    var q = norm(state.q);
    if (!q) return '';
    var cho = isChosungOnly(q);
    var byNameHit = list.filter(function (m) {
      return cho ? m._cho.indexOf(q) >= 0 : norm(m.name + m.saint).indexOf(q) >= 0 || norm(m.name).indexOf(q) >= 0;
    });
    if (!byNameHit.length || byNameHit.length > 5) return '';
    var shownKeys = {};
    list.forEach(function (m) { shownKeys[m.key] = 1; });
    var rows = [];
    byNameHit.forEach(function (m) {
      m.family.forEach(function (f) {
        if (!f.key || shownKeys[f.key] || !byKey[f.key]) return;
        shownKeys[f.key] = 1;
        rows.push(rowHtml(byKey[f.key]).replace('<div class="row-sub">',
          '<div class="row-sub"><span class="fam-of">' + esc(m.name) + '님의 ' + esc(relLabel(f)) + '</span>'));
      });
    });
    if (!rows.length) return '';
    return '<div class="list"><div class="section-title">가족</div>' + rows.join('') + '</div>';
  }

  /** 단체별: 연령단체 순서로 묶음 (§4.2). 회장은 묶음 맨 위. */
  function groupedHtml(list) {
    var buckets = {};
    list.forEach(function (m) {
      var g = m.ageGroup || '연령단체 미지정';
      (buckets[g] = buckets[g] || []).push(m);
    });
    var leaders = {};
    D.groups.forEach(function (g) { if (g.leader) leaders[g.name] = g.leader; });
    return Object.keys(buckets).sort(function (a, b) { return idxIn(AGE_ORDER, a) - idxIn(AGE_ORDER, b); })
      .map(function (g) {
        var ms = buckets[g].sort(function (a, b) {
          return isLeader(b, leaders[g], g) - isLeader(a, leaders[g], g) || byName(a, b);
        });
        return '<div class="list"><div class="section-title">' + esc(g) + ' · ' + ms.length + '명</div>' +
          ms.map(rowHtml).join('') + '</div>';
      }).join('');
  }

  /** 단체 이름이 들어 있지 않은 단체 고유 직책 (2026-11-02: 성가대 지휘자·반주자) */
  var TITLE_GROUP = { '지휘자': '성가대', '반주자': '성가대', '교회위원(교육)': '교육부' };

  /** 회장·리더인가: ① 단체상태 「단체장」 칸의 이름(띄어쓰기 무시) ② 그 단체 직책 */
  function isLeader(m, leaderText, groupName) {
    var full = norm(m.name + m.saint), name = norm(m.name);
    var byList = (leaderText || '').split('·').some(function (s) {
      var t = norm(s);
      return t && (t === full || t === name);
    });
    // 직책에 단체 이름이 들어 있거나(「라자로회 회장」, 「수지구역 구역장」), 그 단체 고유 직책이면(지휘자·반주자 → 성가대)
    var byTitle = !!groupName && !!m.title &&
      (m.title.indexOf(alias(groupName)) >= 0 || TITLE_GROUP[m.title] === alias(groupName));
    return byList || byTitle ? 1 : 0;
  }

  // ── 교우 상세 (§5.3) ──
  var REL = { father: '아버지', mother: '어머니', husband: '남편', wife: '아내', sibling: '형제자매',
    wifeFather: '장인', wifeMother: '장모', husbandFather: '시아버지', husbandMother: '시어머니', sonInLaw: '사위', daughterInLaw: '며느리' };
  // 핵가족·직계 먼저, 형제자매, 인척은 맨 아래 (2026-11-04 Francis님): 배우자 → 자녀 → 부모 → 조부모 → 손주 → 형제자매 → 장인·장모·시부모 → 사위·며느리
  var REL_ORDER = ['husband', 'wife', 'child', 'father', 'mother', 'grandparent', 'grandparentM', 'grandchild', 'sibling', 'wifeFather', 'wifeMother', 'husbandFather', 'husbandMother', 'sonInLaw', 'daughterInLaw'];

  /** 판 번호 82 → 「Ver 0.82」 (2026-11-04 Francis님). 뒤에 붙은 「· 화면 ○○」는 그대로 */
  function verLabel(b) { return String(b).replace(/^(\d+)/, function (n) { return 'Ver 0.' + n; }); }

  function relLabel(f) {
    if (f.rel === 'child') return f.sex === '남' ? '아들' : f.sex === '여' ? '딸' : '자녀';
    if (f.rel === 'grandchild') return f.sex === '남' ? '손자' : f.sex === '여' ? '손녀' : '손주';
    if (f.rel === 'grandparent') return f.sex === '남' ? '조부' : f.sex === '여' ? '조모' : '조부모';
    if (f.rel === 'grandparentM') return f.sex === '남' ? '외조부' : f.sex === '여' ? '외조모' : '외조부모';
    return REL[f.rel] || '';
  }

  /** 상세 항목: 두 칸 격자에 「이름 위, 값 아래」로 촘촘히. 긴 값은 한 줄 전체 (2026-11-02 화면 압축) */
  var WIDE = ['후견인', '이메일', '주소', '메모'];
  function kv(k, v, raw) {
    // 비어 있어도 항목은 늘 보인다 — 무엇이 비었는지 알 수 있게 (2026-11-03 Francis님)
    if (v === null || v === undefined || String(v).trim() === '') { v = '<span class="v-empty">미입력</span>'; raw = true; }
    // 메모는 주황, 확인필요는 빨강 (2026-11-03 Francis님)
    var tone = raw && String(v).indexOf('v-empty') >= 0 ? '' :
      k === '메모' ? ' memo' : (k === '출석 상태' && v === '확인필요') || (k === 'DB 빈칸' && Number(v) > 0) ? ' alert' : '';
    return '<div class="kv2' + (WIDE.indexOf(k) >= 0 ? ' wide' : '') + tone + '"><div class="k">' + esc(k) + '</div><div class="v">' + (raw ? v : esc(v)) + '</div></div>';
  }
  function grid(body) { return body ? '<div class="kv-grid">' + body + '</div>' : ''; }

  function card(title, body, extra, cls) {
    if (!body) return '';
    return '<section class="card' + (cls ? ' ' + cls : '') + '"><h3>' + title + (extra ? '<span class="muted">' + extra + '</span>' : '') + '</h3>' + body + '</section>';
  }

  /** 교우 카드 — 어느 화면에서 열어도 같은 표준 모양 (2026-11-03 Francis님).
   *  랜덤 교우는 카드 위에 기도 띠만 따로 얹고, 카드 자체는 바꾸지 않는다. */
  function renderDetail(m, opts) {
    opts = opts || {};
    // 2026-11-03 Francis님: 「편집」은 사진 왼쪽 위, 「다른 교우」는 사진 오른쪽 위. 기도 띠에는 문구와 「문자」만.
    var editBtn = D.canEdit && m.id ? '<button class="edit-btn hp-left" data-edit="' + m.key + '">' +
      '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M14 6l4 4"/></svg>편집</button>' : '';
    var againBtn = opts.random ? '<button class="edit-btn hp-right" data-random="1">' +
      '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>다른 교우</button>' : '';
    // 문자: 모든 교우 카드에서 (관리자), 사진 오른쪽 아래 (2026-11-03 Francis님)
    var msgBtn = ADMIN ? '<button class="edit-btn hp-right-low" data-pray="' + m.key + '"' + (opts.random ? ' data-kind-msg="pray"' : '') + '>' +
      '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 5h16v11H8l-4 4z"/></svg>문자 안부</button>' : '';
    var html = (opts.random ? '<div class="pray-bar"><div class="prayer">이 교우 분을 떠올리며 하느님께 기도합니다</div></div>' : '') +
      '<header class="detail-hero">' +
      '<button class="back" data-back="1" aria-label="뒤로"' + (opts.random ? ' style="visibility:hidden" tabindex="-1"' : '') + '>' +
        '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 6l-6 6 6 6"/></svg></button>' +
      avatar(m.name, m.photoId, 'lg', 'lg') +
      '<div><span class="detail-name">' + esc(m.name) + '</span>' + (m.saint ? '<span class="detail-saint">' + esc(m.saint) + '</span>' : '') + '</div>' +
      // 직책이 없어도 같은 자리를 비워 두어, 교우마다 머리 높이가 달라지지 않게 (2026-11-03 Francis님)
      (m.title ? '<span class="title-tag">' + esc(m.title) + '</span>' : '<span class="title-tag blank" aria-hidden="true">&nbsp;</span>') +
      // 2026-11-03: 단추는 이름 아래 한 줄에 모아 화면 밖으로 넘치지 않게 (글자를 크게 쓰는 폰에서도)
      (editBtn || msgBtn || againBtn ? '<div class="hero-actions">' + editBtn + msgBtn + againBtn + '</div>' : '') +
      '</header>';

    // 소속
    var chips = [];
    if (m.ageGroup) chips.push(tag(m.ageGroup));
    SERVICE_ORDER.concat(m.service.filter(function (s) { return SERVICE_ORDER.indexOf(s) < 0; }))
      .forEach(function (s) { if (m.service.indexOf(s) >= 0) chips.push(tag(s)); });
    m.small.slice().sort(function (a, b) { return a.localeCompare(b, 'ko'); }).forEach(function (s) { chips.push(tag(s)); });
    if (m.cecil) chips.push(tag('세실대 ' + m.cecil, m.cecil));
    html += card('소속', chips.length ? '<div class="chips">' + chips.join('') + '</div>' : '<div class="fam-none">소속 없음</div>');

    // 가족: 관계 순서(직계 먼저), 같은 관계 안에서 출석 먼저
    var fam = m.family.slice().sort(function (a, b) {
      // 관계 순서가 먼저, 같은 관계 안에서만 출석 가족 먼저 (2026-11-04 Francis님: 비출석이라도 직계는 위로)
      return REL_ORDER.indexOf(a.rel) - REL_ORDER.indexOf(b.rel) || (b.attending ? 1 : 0) - (a.attending ? 1 : 0);
    });
    var famHtml = fam.map(function (f) {
      var shownName = f.name || f.text;
      var inner = avatar(shownName, f.photoId || '', 'md') +
        '<div class="row-main"><div class="fam-name">' + esc(shownName) +
        (f.saint ? '<span class="row-saint">' + esc(f.saint) + '</span>' : '') + '</div>' +
        '<div class="fam-rel">' + esc(relLabel(f)) + (f.attending ? '' : ' (' + (f.status === '확인필요' ? '확인필요' : '비출석') + ')') + '</div></div>';
      return f.key
        ? '<button class="fam' + (f.attending ? '' : ' off') + '" data-go="' + f.key + '">' + inner + '<span class="row-tail">' + chevron() + '</span></button>'
        : '<div class="fam off">' + inner + '</div>';
    }).join('');
    famHtml = famHtml ? '<div class="fam-list">' + famHtml + '</div>' : '<div class="fam-none">등록된 가족 없음</div>';  // 가족이 없어도 칸은 보인다 (2026-11-02 Francis님)
    html += card('가족', famHtml, m.famCount ? '함께 출석 ' + m.famCount + '명 (본인 포함)' : '');


    if (ADMIN) {
      var tel = m.phone ? '<a href="tel:' + esc(m.phone.replace(/[^0-9+]/g, '')) + '">' + esc(m.phone) + '</a>' : '';
      html += card('연락', grid(kv('휴대폰', tel, true) + kv('카톡 등록', yn(m.kakao)) + kv('이메일', m.email) + kv('주소', m.address)));
      // 「관리」를 둘로 나눔 (2026-11-03 Francis님): 인적 사항 / 신앙관리. 신앙관리는 사제단·교회위원(관리자)만
      html += card('인적 사항', grid(
        kv('성별', m.sex) + kv('생년', m.birthYear) + kv('생년월일', m.birthDate) + kv('만 나이', m.age) +
        kv('사진사용 동의', m.photoOk) + kv('연락 동의', m.contactOk)));
      // 신앙 + 신앙관리를 한 칸으로, 관리자만 (2026-11-03 Francis님). 교적·성사 → 관리 순
      html += card('신앙관리', grid(
        kv('교적 등재', yn(m.registered)) + kv('교적번호', m.id) + kv('출신교파', m.origin) + kv('등록일', m.regDate) +
        kv('세례일', m.baptism) + kv('견진일', m.confirm) + kv('후견인', m.sponsor || '없음 (확인 필요)') + kv('출석 상태', m.status) +
        kv('최근 3개월 출석 횟수', m.recent == null ? '' : m.recent + '회') +
        kv('네트웍 점수', m.network == null ? '' : m.network + (m.networkGrade ? ' (' + m.networkGrade + ')' : '')) +
        kv('DB 빈칸', m.checkScore) + kv('메모', m.memo)));
      // 달란트 보유 (나눔 의사는 아직 받지 않아 「보유」로, 2026-11-03): 관리 옆(컴퓨터)·아래(폰). 관리자(교역자·교회위원)만 (2026-11-03 Francis님)
      var tal = (m.talent || []);
      html += card('달란트 보유', tal.length ? '<div class="chips">' + tal.map(function (x) { return '<span class="tag talent">' + esc(x) + '</span>'; }).join('') + '</div>' : '<div class="fam-none">미입력</div>');
    }
    screen.innerHTML = html;
    wirePhotos();
  }

  /** 반자동 문자·메일: 문구를 채워 폰의 문자 앱(메일 앱)을 연다. 보내기는 사람이 누른다 (2026-11-02) */
  function contactCard(m) {
    var digits = (m.phone || '').replace(/[^0-9+]/g, '');
    var who = m.name + (m.saint ? ' ' + m.saint : '') + '님';
    var me = D.me ? '수원교회 ' + D.me + '입니다.' : '수원교회입니다.';
    var msgs = [
      ['안부', who + ', ' + me + ' 요즘 어떻게 지내시는지 안부 여쭙습니다. 늘 함께 기도하고 있습니다. 평안하시길 빕니다.'],
      ['새교우 환영', who + ', ' + me + ' 수원교회에 오신 것을 진심으로 환영합니다. 궁금하신 점이나 도움이 필요하시면 언제든 연락 주십시오.'],
      ['생일 축하', who + ', ' + me + ' 생일을 축하드립니다. 하느님의 은총과 평화가 늘 함께하시길 빕니다.'],
    ];
    // 번호가 있으면 문자 앱으로, 없으면 공유 창(카카오톡 등)으로 — 받는 사람은 거기서 고른다
    var btns = msgs.map(function (x) {
      return digits
        ? '<a class="msg-btn" href="sms:' + esc(digits) + '?&body=' + encodeURIComponent(x[1]) + '">' + x[0] + ' 문자</a>'
        : '<button class="msg-btn" data-share="' + esc(x[1]) + '">' + x[0] + ' 보내기</button>';
    }).join('');
    if (m.email) btns += '<a class="msg-btn mail" href="mailto:' + esc(m.email) + '?subject=' + encodeURIComponent('수원교회에서 안부 드립니다') +
      '&body=' + encodeURIComponent(msgs[0][1]) + '">이메일</a>';
    return '<section class="card"><h3>연락하기<span class="muted">' + (digits ? '문구를 고쳐 보내셔도 됩니다' : '카카오톡에서 받는 분을 고르십시오') + '</span></h3>' +
      '<div class="msg-btns">' + btns + '</div></section>';
  }

  /** 공유 창 열기 (카카오톡·문자 등). 공유 창이 없는 기기에서는 문구를 복사 */
  function shareText(text) {
    if (navigator.share) { navigator.share({ text: text }).catch(function () {}); return; }
    try { navigator.clipboard.writeText(text); alert('문구를 복사했습니다. 카카오톡에 붙여 넣으십시오.'); }
    catch (e) { prompt('아래 문구를 복사하십시오', text); }
  }

  function tag(s, group) {
    return '<button class="tag" data-group="' + esc(group || s) + '">' + esc(s) + '</button>';
  }

  // ── 랜덤 교우 (§5.9) ──
  function pickRandom() {
    var pool = D.members.filter(function (m) { return !ADMIN || m.status === '출석'; });
    if (!pool.length) return null;
    var m;
    for (var i = 0; i < 5; i++) {
      m = pool[Math.floor(Math.random() * pool.length)];
      if (m.key !== state.lastRandom || pool.length === 1) break;
    }
    state.lastRandom = m.key;
    return m;
  }

  // ── 아래 탭 (§5.1) ──
  var TABS = [
    { id: 'stats', label: '인원 통계', admin: true, icon: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>' },
    { id: 'groups', label: '활동 단체', icon: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/>' },
    { id: 'search', label: '교우 검색', icon: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>' },
    { id: 'care', label: '돌봄 필요', admin: true, icon: '<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>' },
    { id: 'random', label: '랜덤 교우', icon: '<path d="M12 3l2.2 6.8H21l-5.5 4 2.1 6.7L12 16.4 6.4 20.5l2.1-6.7L3 9.8h6.8z"/>' },
  ];

  function iconSearch(px) {
    return '<svg width="' + px + '" height="' + px + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>';
  }

  function renderTabs() {
    tabsEl.innerHTML = TABS.filter(function (t) { return ADMIN || !t.admin; }).map(function (t) {
      return '<button class="tab' + (state.tab === t.id ? ' on' : '') + '" data-tab="' + t.id + '">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">' + t.icon + '</svg>' +
        t.label + '</button>';
    }).join('');
  }

  // ════════════════════════════════════════════
  // 단체 (§5.4) · 섬기는 이들 (§5.5)
  // ════════════════════════════════════════════

  function attending() { return D.members.filter(function (m) { return !ADMIN || m.status === '출석'; }); }
  function alias(name) { return name === '교회위원회' ? '교회위원' : name; }
  function shown(name) { return name === '교회위원회' ? '교회위원' : name; }

  function inGroup(m, name) {
    var n = alias(name);
    return m.ageGroup === n || m.service.indexOf(n) >= 0 || m.small.indexOf(n) >= 0 || m.cecil === n;
  }

  function groupInfo(name) {
    var n = alias(name);
    for (var i = 0; i < D.groups.length; i++) {
      if (alias(D.groups[i].name) === n) return D.groups[i];
    }
    return null;
  }

  /** 구분별 단체 목록. 단체상태 + 실제 자료에 있는 이름을 합쳐, §4.2 순서로. */
  function groupsOf(kind) {
    var names = [];
    D.groups.forEach(function (g) {
      if (g.kind === kind && g.name !== '직책 섬김이') names.push(alias(g.name));
    });
    attending().forEach(function (m) {
      var vals = kind === '연령단체' ? [m.ageGroup] : kind === '봉사단체' ? m.service : kind === '소그룹' ? m.small : [m.cecil];
      vals.forEach(function (v) { if (v && names.indexOf(v) < 0) names.push(v); });
    });
    var order = kind === '연령단체' ? AGE_ORDER : kind === '봉사단체' ? SERVICE_ORDER : kind === '세실대' ? CECIL_ORDER : null;
    return names.sort(function (a, b) {
      return order ? idxIn(order, a) - idxIn(order, b) || a.localeCompare(b, 'ko') : a.localeCompare(b, 'ko');
    });
  }

  function countIn(name) { return attending().filter(function (m) { return inGroup(m, name); }).length; }

  function heroBack(title, sub) {
    return '<header class="detail-hero sub-hero"><button class="back" data-back="1" aria-label="뒤로">' +
      '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 6l-6 6 6 6"/></svg></button>' +
      '<div class="sub-title">' + esc(title) + '</div>' + (sub ? '<div class="sub-note">' + esc(sub) + '</div>' : '') + '</header>';
  }

  function heroTop(title) {
    return '<header class="hero">' + brand(title) + '</header>';
  }

  var KINDS = ['연령단체', '봉사단체', '소그룹', '세실대'];

  /** 활동 단체 첫 화면: 묶음마다 단체 타일(이름 + 출석 인원). 한 번 누르면 바로 명단 (2026-11-02) */
  function renderGroupsHome() {
    var html = heroTop('활동 단체');
    var sg = servantGroups();
    var count = function (k) { return sg[k].sections.reduce(function (t, x) { return t + x[1].length; }, 0); };
    // 리더(단체장)는 「단체상태」 단체장 칸에서 (2026-11-03 Francis님)
    var lead = function (name) {
      var g = groupInfo(name);
      return g && g.leader ? '<span class="t-dot"> · </span><span class="t-lead">' + esc(g.leader) + '</span>' : '';
    };
    var SERVANT_NAME = { clergy: '사목단', council: '교회위원회' };
    html += tileSection('섬기는 이들', ['clergy', 'council', 'titled'].map(function (k) {
      return '<button class="tile" data-servants="' + k + '"><span class="t-name">' + sg[k].title + '</span>' +
        '<span class="t-num">' + count(k) + '명' + (SERVANT_NAME[k] ? lead(SERVANT_NAME[k]) : '') + '</span></button>';
    }));
    var tileOf = function (n) {
      var g = groupInfo(n);
      var dormant = g && g.state === '휴면';
      return '<button class="tile' + (dormant ? ' dormant' : '') + '" data-group="' + esc(n) + '">' +
        '<span class="t-name">' + esc(shown(n)) + (ageShort(n) ? '<span class="t-age">' + esc(ageShort(n)) + '</span>' : '') + '</span>' +
        '<span class="t-num">' + (dormant ? '휴면' : countIn(n) + '명' + lead(n)) + '</span></button>';
    };
    // 소그룹은 「소그룹」 큰 제목 하나 아래에 주제별 작은 제목으로 묶는다 (2026-11-03 Francis님)
    var smallSubs = [];
    kindCards().forEach(function (c) {
      if (!c.names.length) return;
      if (c.kind.indexOf('소그룹 · ') === 0) { smallSubs.push(c); return; }
      if (smallSubs.length && !smallSubs.done) { html += smallSection(smallSubs, tileOf); smallSubs.done = true; }
      html += tileSection(c.kind, c.names.map(tileOf));
    });
    if (smallSubs.length && !smallSubs.done) html += smallSection(smallSubs, tileOf);
    screen.innerHTML = html;
  }

  function smallSection(subs, tileOf) {
    var n = subs.reduce(function (t, c) { return t + c.names.length; }, 0);
    return '<section class="tile-sec tile-group"><div class="tile-title">소그룹<span class="tile-count">' + n + '개 모임</span></div><div class="tile-group-body">' +
      subs.map(function (c) {
        var tiles = c.names.map(tileOf);
        while (tiles.length % 2) tiles.push('<div class="tile filler"></div>');
        return '<div class="tile-sub"><div class="tile-subtitle">' + esc(c.kind.replace('소그룹 · ', '')) + '</div>' +
          '<div class="tiles">' + tiles.join('') + '</div></div>';
      }).join('') + '</div></section>';
  }

  function tileSection(title, tiles) {
    while (tiles.length % 2) tiles.push('<div class="tile filler"></div>');  // 줄 끝 빈칸을 흰색으로 채움
    return '<section class="tile-sec"><div class="tile-title">' + esc(title) + '</div>' +
      '<div class="tiles">' + tiles.join('') + '</div></section>';
  }

  function groupLine(name) {
    var g = groupInfo(name);
    var dormant = g && g.state === '휴면';
    return '<button class="row" data-group="' + esc(name) + '"><div class="row-main">' +
      '<div class="row-name">' + esc(shown(name)) + (dormant ? ' <span class="status-tag">휴면</span>' : '') + '</div>' +
      (g && g.leader ? '<div class="row-sub"><span class="txt">' + esc(g.leader) + '</span></div>' : '') +
      '</div><div class="row-tail"><span class="row-count">' + countIn(name) + '명</span>' + chevron() + '</div></button>';
  }

  /** 활동단체 카드: 연령단체는 남성·여성·기타로 나눈다 (2026-11-02 Francis님) */
  function kindCards() {
    var ages = groupsOf('연령단체');
    var known = {};
    var cards = AGE_GROUP_SECTIONS.map(function (sec) {
      var ns = ages.filter(function (n) { return sec.names.indexOf(n) >= 0; });
      ns.forEach(function (n) { known[n] = 1; });
      return { kind: '연령단체(' + sec.label + ')', names: ns };
    });
    var rest = ages.filter(function (n) { return !known[n]; });
    cards[cards.length - 1].names = cards[cards.length - 1].names.concat(rest); // 목록에 없는 연령단체는 기타로
    // 사목단·교회위원은 「섬기는 이들」에서 보므로 봉사단체 목록에서는 뺀다 (2026-11-02 Francis님)
    var SERVANT_GROUPS = ['사목단', '교회위원'];
    var service = groupsOf('봉사단체').filter(function (n) { return SERVANT_GROUPS.indexOf(n) < 0; });
    // 소그룹은 「단체상태」 주제 열로 나눈다 (2026-11-03 Francis님). 주제가 없으면 「기타」
    var TOPICS = ['기도', '말씀·독서', '손길 봉사', '지역 구역', '친교·나눔'];
    var small = groupsOf('소그룹'), byTopic = {};
    small.forEach(function (n) {
      var g = groupInfo(n), t = (g && g.topic) || '기타';
      (byTopic[t] = byTopic[t] || []).push(n);
    });
    var topics = TOPICS.filter(function (t) { return byTopic[t]; })
      .concat(Object.keys(byTopic).filter(function (t) { return TOPICS.indexOf(t) < 0 && t !== '기타'; }))
      .concat(byTopic['기타'] ? ['기타'] : []);
    return cards.concat([{ kind: '봉사단체', names: service }],
      topics.map(function (t) { return { kind: '소그룹 · ' + t, names: byTopic[t] }; }),
      [{ kind: '세실대', names: groupsOf('세실대') }]);
  }

  function renderKind(kind) {
    var c = kindCards().filter(function (x) { return x.kind === kind; })[0];
    var names = c ? c.names : [];
    screen.innerHTML = heroBack(kind) + '<div class="list">' +
      (names.length ? names.map(groupLine).join('') : '<div class="empty">단체가 없습니다.</div>') + '</div>';
  }

  // 연령단체 나이 기준: 단체 화면에만 보이고 교우 카드에는 보이지 않는다 (2026-11-03 Francis님)
  var AGE_DESC = {
    '베로니카회': '36~45세 여성 교우들의 봉사와 친교 모임',
    '그라티아회': '18~35세 청년 교우들의 봉사와 친교 모임',
    '에스더회': '46~55세 여성 교우들의 봉사와 친교 모임',
    '모니카회': '56~69세 여성 교우들의 봉사와 친교 모임',
    '미리암회': '70세 이상 여성 교우들의 봉사와 친교 모임',
    '바울로회': '36~50세 남성 교우들의 봉사와 친교 모임',
    '라자로회': '51~65세 남성 교우들의 봉사와 친교 모임',
    '니콜라회': '66세 이상 남성 교우들의 봉사와 친교 모임',
  };
  // 상자에 짧게: 「36~45세」
  function ageShort(name) { var m = (AGE_DESC[name] || '').match(/^(\S+세(?: 이상)?)/); return m ? m[1] : ''; }
  function renderGroup(name) {
    var g = groupInfo(name);
    var leader = g ? g.leader : '';
    var ms = attending().filter(function (m) { return inGroup(m, name); }).sort(function (a, b) {
      return isLeader(b, leader, name) - isLeader(a, leader, name) || byName(a, b);
    });
    var leadLabel = g && g.kind === '소그룹' ? '리더' : '회장';
    var sub = (AGE_DESC[name] ? AGE_DESC[name] + ' · ' : '') + (g && g.state === '휴면' ? '휴면 · ' : '') + '출석 ' + ms.length + '명';
    var html = heroBack(shown(name), sub);
    html += '<div class="list">' + (ms.length ? ms.map(function (m) {
      // 직책 표시가 없는 회장·리더에게는 「회장」(소그룹은 「리더」) 표시를 붙여 맨 위에 보이게 한다
      if (!isLeader(m, leader, name) || m.title) return rowHtml(m);
      return rowHtml(Object.assign({}, m, { title: leadLabel }));
    }).join('') : '<div class="empty">출석 교우가 없습니다.</div>') + '</div>';
    screen.innerHTML = html;
    wirePhotos();
  }

  var AGE_GROUP_SECTIONS = [
    { label: '남성', names: ['니콜라회', '라자로회', '바울로회'] },
    { label: '여성', names: ['미리암회', '모니카회', '에스더회', '베로니카회'] },
    { label: '기타', names: ['그라티아회', '주일학교'] },
  ];

  /** 섬기는 이들 (§5.5): 사목단 · 교회위원회 · 직책 섬김이를 각각 따로 연다 */
  function servantGroups() {
    var att = attending();
    var byRank = function (a, b) { return titleRank(a) - titleRank(b) || byName(a, b); };
    var council = att.filter(function (m) { return m.service.indexOf('교회위원') >= 0; });
    var heads = council.filter(function (m) { return titleRank(m) <= 6; }).sort(byRank);
    var exOfficio = council.filter(function (m) { return titleRank(m) === 8; }).sort(byName);
    var elected = council.filter(function (m) { return heads.indexOf(m) < 0 && exOfficio.indexOf(m) < 0; }).sort(byRank);
    return {
      clergy: { title: '사목단', sections: [['', att.filter(function (m) { return m.service.indexOf('사목단') >= 0; }).sort(byRank)]] },
      // 2026-11-02: 묶음 이름(선출직·당연직) 없이 신자회장 → 사제회장 → 교회위원 순서로 한 명단
      council: { title: '교회위원회', sections: [['', council.slice().sort(byRank)]] },
      // 직책 섬김이: 사목단 → 교회위원 → 감사 → 기타 직책장 (지휘자·반주자 등도 들어가 「단체장」 대신 「직책장」, 2026-11-02)
      titled: (function () {
        var all = att.filter(function (m) { return m.title; }).sort(byRank);
        var band = function (lo, hi) { return all.filter(function (m) { var r = titleRank(m); return r >= lo && r <= hi; }); };
        return { title: '직책 섬김이', sections: [['사목단', band(1, 4)], ['교회위원', band(5, 8)], ['감사', band(9, 9)], ['기타 직책장', band(10, 10)]] };
      })(),
    };
  }

  function renderServants(which) {
    var sg = servantGroups();
    var g = sg[which];
    if (!g) {
      var html = heroBack('섬기는 이들') + '<div class="list">' + ['clergy', 'council', 'titled'].map(function (k) {
        var n = sg[k].sections.reduce(function (t, x) { return t + x[1].length; }, 0);
        return '<button class="row" data-servants="' + k + '"><div class="row-main"><div class="row-name">' + sg[k].title + '</div></div>' +
          '<div class="row-tail"><span class="row-count">' + n + '명</span>' + chevron() + '</div></button>';
      }).join('') + '</div>';
      screen.innerHTML = html;
      return;
    }
    var total = g.sections.reduce(function (t, x) { return t + x[1].length; }, 0);
    screen.innerHTML = heroBack(g.title, total + '명') + g.sections.map(function (x) {
      return x[1].length ? '<div class="list">' + (x[0] ? '<div class="section-title">' + esc(x[0]) + '</div>' : '') +
        x[1].map(rowHtml).join('') + '</div>' : '';
    }).join('');
    wirePhotos();
  }

  function section(title, ms) {
    if (!ms.length) return '';
    return '<div class="list"><div class="section-title">' + esc(title) + '</div>' + ms.map(rowHtml).join('') + '</div>';
  }

  // ════════════════════════════════════════════
  // 인원통계 (§5.6) — 가로 막대, 누르면 명단
  // ════════════════════════════════════════════

  function note(name) { var g = groupInfo(name); return g ? g.note : ''; }

  /** 차트 정의: 각 칸 = {label, test(m)} */
  function charts() {
    var att = D.members.filter(function (m) { return !ADMIN || m.status === '출석'; });
    var list = [];
    // 원 그래프 색: 색맹 검사(dataviz validate_palette) 통과한 조합
    if (ADMIN) list.push({ id: 'status', type: 'donut', title: '출석상태', base: D.members, den: D.members.length, note: '전체 교적 기준', items: [
      { label: '출석', color: '#2E86C1', test: function (m) { return m.status === '출석'; } },
      { label: '비출석', color: '#C0392B', test: function (m) { return m.status === '비출석'; } },
      { label: '확인필요', color: '#D4A017', test: function (m) { return m.status !== '출석' && m.status !== '비출석'; } },
    ] });
    list.push({ id: 'sex', type: 'donut', title: '성별 현황 (출석 기준)', items: [
      { label: '남성 교우', color: '#2E86C1', test: function (m) { return m.sex === '남'; } },
      { label: '여성 교우', color: '#E08E3C', test: function (m) { return m.sex === '여'; } },
      { label: '성별 미상', color: '#C0392B', test: function (m) { return m.sex !== '남' && m.sex !== '여'; } },
    ] });
    // 단체별 인원은 활동단체 화면에 있으므로 여기서는 「어디에 속해 있는가」만 본다 (2026-11-02 결정)
    var none = function (m) { return !m.service.length && !m.small.length && !m.cecil; };
    list.push({ id: 'belong', title: '소속 현황', note: '한 사람이 여러 곳에 해당', items: [
      { label: '연령단체 미지정', tone: 'red', test: function (m) { return !m.ageGroup; } },
      { label: '연령단체 외 소속 없음', tone: 'red', test: none },
      { label: '봉사단체 1곳 이상', color: '#2E6FB5', test: function (m) { return m.service.length > 0; } },
      { label: '소그룹 1곳 이상', color: '#2E6FB5', test: function (m) { return m.small.length > 0; } },
      { label: '세실대 수료', color: '#2E6FB5', test: function (m) { return !!m.cecil; } },
    ] });
    // 원그래프 (2026-11-02). 색은 빨·주·노·파 — 이웃 색끼리 색맹 검사 통과
    if (ADMIN) list.push({ id: 'recent', type: 'donut', title: '최근 3개월 출석 횟수', items: [
      // 13주 기준 (2026-11-02 Francis님: 3·6·9회로 나눔)
      { label: '3회 이하', tone: 'red', color: '#B03A2E', test: function (m) { return m.recent !== null && m.recent !== undefined && m.recent <= 3; } },
      { label: '4~6회', color: '#E8762C', test: function (m) { return m.recent >= 4 && m.recent <= 6; } },
      { label: '7~9회', color: '#EDC53A', test: function (m) { return m.recent >= 7 && m.recent <= 9; } },
      { label: '10회 이상', color: '#2E6FB5', test: function (m) { return m.recent >= 10; } },
    ] });
    list.push({ id: 'family', type: 'donut', title: '함께 출석하는 가족', items: [
      { label: '혼자 출석', tone: 'red', color: '#B03A2E', test: function (m) { return (m.famCount || 1) <= 1; } },
      { label: '2인 출석', color: '#E8762C', test: function (m) { return m.famCount === 2; } },
      // 3인 이상: 녹색(청록빛) — 빨강·주황과 색맹 구별 검사 통과
      { label: '3인 이상 출석', color: '#1E8C7E', test: function (m) { return m.famCount >= 3; } },
    ] });
    // 기준 문장은 Francis님 문안 (2026-11-02)
    if (ADMIN) list.push({ id: 'network', type: 'strip', title: '공동체 연결 정도',
      desc: '기준: 직계 가족 1명당 끈점수 1점\n소속 단체마다 끈점수 1점 (단 연령단체는 제외)',
      items: [
        // 빨·주·노·녹·파 5단계 (2026-11-02 Francis님). 색맹 검사로 이웃 색끼리 구별되는 값으로 고름
        { label: '매우 약함 (끈 0개)', tone: 'red', color: '#B03A2E', test: function (m) { return m.network === 0; } },
        { label: '약함 (끈 1개)', color: '#E8762C', test: function (m) { return m.network === 1; } },
        { label: '보통 (끈 2~3개)', color: '#EDC53A', test: function (m) { return m.network >= 2 && m.network <= 3; } },
        { label: '강함 (끈 4개)', color: '#2E9E5B', test: function (m) { return m.network === 4; } },
        { label: '매우 강함 (끈 5개 이상)', color: '#2E6FB5', test: function (m) { return m.network >= 5; } },
      ] });
    list.forEach(function (c) {
      c.base = c.base || att;
      c.den = c.den || att.length;
    });
    return list;
  }

  /** 원 그래프(도넛) + 누르는 범례. 조각 사이 2px 틈, 가운데 합계 */
  function donutCard(c, rows) {
    var total = rows.reduce(function (t, r) { return t + r.n; }, 0) || 1;
    var R = 38, C = 2 * Math.PI * R, gap = rows.filter(function (r) { return r.n; }).length > 1 ? 2 : 0, off = 0;
    var segs = rows.map(function (r) {
      if (!r.n) return '';
      var len = r.n / total * C;
      var seg = '<circle r="' + R + '" cx="50" cy="50" fill="none" stroke="' + r.color + '" stroke-width="16"' +
        ' stroke-dasharray="' + Math.max(len - gap, 0.5).toFixed(2) + ' ' + C.toFixed(2) + '" stroke-dashoffset="' + (-off).toFixed(2) + '"' +
        ' transform="rotate(-90 50 50)" class="seg-hit" data-stat="' + c.id + ':' + r.i + '"><title>' + esc(r.label) + ' ' + r.n + '명</title></circle>';
      off += len;
      return seg;
    }).join('');
    var legend = rows.map(function (r) {
      return '<button class="lg-row' + (r.tone ? ' tone-' + r.tone : '') + '" data-stat="' + c.id + ':' + r.i + '"><span class="sw" style="background:' + r.color + '"></span>' +
        '<span class="lg-label">' + esc(r.label) + '</span><span class="lg-val">' + r.n + '명 (' + pct(r.n, c.den) + '%)</span></button>';
    }).join('');
    return '<section class="card"><h3>' + esc(c.title) + (c.note ? '<span class="muted">' + esc(c.note) + '</span>' : '') + '</h3>' +
      (c.desc ? '<div class="chart-desc">' + esc(c.desc) + '</div>' : '') +
      '<div class="donut-wrap"><svg class="donut" viewBox="0 0 100 100" role="img" aria-label="' + esc(c.title) + '">' + segs +
      '<text x="50" y="49" text-anchor="middle" class="d-total">' + total + '</text><text x="50" y="62" text-anchor="middle" class="d-unit">명</text></svg>' +
      '<div class="legend">' + legend + '</div></div></section>';
  }

  /** 한 줄 띠 그래프: 약함 → 강함을 왼쪽에서 오른쪽으로. 칸 안에는 %(넓을 때만), 아래 범례는 눌러서 명단 */
  function stripCard(c, rows) {
    var total = rows.reduce(function (t, r) { return t + r.n; }, 0) || 1;
    var strip = rows.map(function (r) {
      if (!r.n) return '';
      var w = r.n / total * 100;
      return '<button class="st-seg" data-stat="' + c.id + ':' + r.i + '" style="width:' + w + '%;background:' + r.color + '" aria-label="' + esc(r.label) + '">' +
        (w >= 9 ? '<span>' + pct(r.n, c.den) + '%</span>' : '') + '</button>';
    }).join('');
    var legend = rows.map(function (r) {
      return '<button class="lg-row' + (r.tone ? ' tone-' + r.tone : '') + '" data-stat="' + c.id + ':' + r.i + '"><span class="sw" style="background:' + r.color + '"></span>' +
        '<span class="lg-label">' + esc(r.label) + '</span><span class="lg-val">' + r.n + '명 (' + pct(r.n, c.den) + '%)</span></button>';
    }).join('');
    return '<section class="card"><h3>' + esc(c.title) + '</h3>' +
      (c.desc ? '<div class="chart-desc">' + esc(c.desc) + '</div>' : '') +
      '<div class="st-ends"><span>← 약함</span><span>강함 →</span></div>' +
      '<div class="strip">' + strip + '</div>' +
      '<div class="legend st-legend">' + legend + '</div></section>';
  }

  function pct(n, den) { return den ? Math.round(n / den * 100) : 0; }

  function renderStats() {
    var att = attending();
    var html = heroTop('인원 통계');
    charts().forEach(function (c) {
      var rows = c.items.map(function (it, i) {
        var n = c.base.filter(it.test).length;
        return { label: it.label, n: n, i: i, note: it.note, tone: it.tone || '', color: it.color };
      });
      if (c.type === 'donut') { html += donutCard(c, rows); return; }
      if (c.type === 'strip') { html += stripCard(c, rows); return; }
      var max = Math.max.apply(null, rows.map(function (r) { return r.n; }).concat([1]));
      html += '<section class="card"><h3>' + esc(c.title) + (c.note ? '<span class="muted">' + esc(c.note) + '</span>' : '') + '</h3>' +
        (c.desc ? '<div class="chart-desc">' + esc(c.desc) + '</div>' : '') +
        rows.map(function (r) {
          return '<button class="bar-row' + (r.tone ? ' tone-' + r.tone : '') + '" data-stat="' + c.id + ':' + r.i + '">' +
            '<div class="bar-head"><span class="bar-label">' + esc(r.label) + '</span>' +
            '<span class="bar-val">' + r.n + '명 (' + pct(r.n, c.den) + '%)</span></div>' +
            '<div class="bar-track"><div class="bar-fill" style="width:' + (r.n / max * 100) + '%' + (r.color ? ';background:' + r.color : '') + '"></div></div>' +
            (r.note ? '<div class="bar-note">' + esc(r.note) + '</div>' : '') + '</button>';
        }).join('') + '</section>';
    });
    screen.innerHTML = html;
  }

  function renderStatList(key) {
    var p = key.split(':');
    var c = charts().filter(function (x) { return x.id === p[0]; })[0];
    var it = c && c.items[Number(p[1])];
    if (!it) return renderStats();
    var ms = c.base.filter(it.test).sort(byName);
    screen.innerHTML = heroBack(c.title + ' · ' + it.label, ms.length + '명 (' + pct(ms.length, c.den) + '%)') +
      '<div class="list">' + (ms.length ? ms.map(rowHtml).join('') : '<div class="empty">해당 교우가 없습니다.</div>') + '</div>';
    wirePhotos();
  }

  // ════════════════════════════════════════════
  // 돌봄 필요 (§5.7) — 관리자만 (열람자에게는 자료 자체가 오지 않음)
  // ════════════════════════════════════════════

  var YEAR = 365 * 24 * 3600 * 1000;
  function careGroups() {
    var att = D.members.filter(function (m) { return m.status === '출석'; });
    return [
      // 새교우 = 새교우 교육 또는 전입식 이후 1년 미만 (2026-11-02 Francis님). 날짜는 교적부 「등록일」을 쓴다.
      { name: '새교우', fixedNote: '새교우 교육 또는 전입식 이후 1년 미만', test: function (m) { return (m.regTime && Date.now() - m.regTime <= YEAR) || /새교우/.test(m.memo || ''); } },
      // 기준 3회 이하 (2026-11-02 결정, 인원통계 「3회 이하」와 같음). 시트 비고 문장보다 이 기준이 우선.
      { name: '최저 출석자', fixedNote: '최근 3개월(13주) 출석 3회 이하 (출석 교우 중)', test: function (m) { return m.recent !== null && m.recent !== undefined && m.recent <= 3; } },
      // 2026-11-02: 「매우 약함」(끈 0개)만 돌봄 대상으로
      { name: '연결 매우 약함', fixedNote: '공동체 끈 0개\n(연령단체 소속은 산입 제외)', test: function (m) { return m.network === 0; } },
      { name: '초고령층', test: function (m) { return m.age >= 80; } },
    ].map(function (g, i) {
      g.i = i;
      g.note = g.fixedNote || note(g.name);
      g.members = att.filter(g.test).sort(byName);
      return g;
    });
  }

  function careRow(m) {
    var extra = '최근 3개월 ' + (m.recent == null ? '—' : m.recent + '회') + ' · 네트웍 ' + (m.network == null ? '—' : m.network);
    var html = rowHtml(m);
    var at = html.lastIndexOf('</div></button>');
    return html.slice(0, at) + '<div class="row-sub"><span class="txt care-extra">' + esc(extra) + '</span></div>' + html.slice(at);
  }

  /** 돌봄 필요: 네 묶음을 2×2 타일로 한 화면에 (2026-11-02 Francis님) */
  function renderCare() {
    var html = heroTop('돌봄 필요') + '<div class="care-grid">';
    careGroups().forEach(function (g) {
      html += '<button class="care-tile" data-care="' + g.i + '">' +
        '<div class="care-name">' + esc(g.name) + '</div>' +
        '<div class="care-num">' + g.members.length + '<span>명</span></div>' +
        (g.note ? '<div class="care-note">' + esc(g.note.replace(/^기준:\s*/, '')) + '</div>' : '') + '</button>';
    });
    screen.innerHTML = html + '</div>';
  }

  function renderCareList(i) {
    var g = careGroups()[Number(i)];
    if (!g) return renderCare();
    var addBtn = g.name === '새교우' && D.canEdit
      ? '<div class="new-bar"><button class="ef-save new-btn" data-newmember="1">＋ 새교우 등록</button></div>' : '';  // 2026-11-04 Francis님
    screen.innerHTML = heroBack(g.name, g.members.length + '명' + (g.note ? ' · ' + g.note : '')) + addBtn +
      '<div class="list">' + (g.members.length ? g.members.map(careRow).join('') : '<div class="empty">해당 교우가 없습니다.</div>') + '</div>';
    wirePhotos();
  }

  // ════════ 교우 카드 편집 (편집자만, 2026-11-03) ════════
  // 시트에 보이는 그대로의 값을 받아 고치고, 바뀐 칸만 「이전 값」과 함께 보낸다.
  // 서버가 저장 직전 시트 값과 비교해, 그사이 누가 바꾼 칸은 저장하지 않는다.
  var EDIT = null;
  var EDIT_SECTIONS = [
    { title: '기본', fields: [['name', '성명'], ['saint', '신명'], ['sex', '성별', 'sex'], ['birthYear', '생년'], ['birthDate', '생년월일', '', '19650301'], ['title', '직책']] },
    { title: '출석·교적', fields: [['status', '출석 상태', ['', '출석', '비출석', '확인필요']], ['registered', '교적 등재', ['', 'Y', '?', 'N']], ['recent', '최근 3개월 출석', '', '7']] },
    { title: '소속', fields: [['ageGroup', '연령단체', 'age'], ['service', '봉사단체', 'multi:봉사단체'], ['small', '소그룹', 'multi:소그룹'], ['cecil', '세실대', 'one:세실대']] },
    { title: '신앙', fields: [['origin', '출신교파'], ['regDate', '등록일', '', '2018. 3. 14.'], ['baptism', '세례일', '', '2019. 4. 21.'], ['confirm', '견진일', '', '2020. 5. 3.'], ['sponsor', '후견인']] },
    { title: '가족', fields: [['father', '부', 'fam'], ['mother', '모', 'fam'], ['husband', '남편', 'fam'], ['wife', '아내', 'fam'], ['child1', '자녀1', 'fam'], ['child2', '자녀2', 'fam'], ['child3', '자녀3', 'fam'], ['siblings', '형제자매', 'sibs']] },
    { title: '연락', fields: [['phone', '휴대폰', '', '010-0000-0000'], ['kakao', '카톡 등록', ['', 'Y', 'N', '확인필요']], ['email', '이메일'], ['address', '주소'], ['photoOk', '사진사용 동의', ['', '예', '아니오']], ['contactOk', '연락 동의', ['', '예', '아니오']]] },
    { title: '달란트 보유', fields: [['talent', '달란트 (쉼표로 여러 개)', '', '피아노 반주, 사진, 요리']] },
    { title: '메모', fields: [['memo', '메모', 'area']] },
  ];

  function famLabel(m) { return (m.id + ' ' + m.name + (m.saint ? ' ' + m.saint : '')).trim(); }
  function splitList(v) { return String(v || '').split(',').map(function (x) { return x.trim(); }).filter(String); }
  function groupNames(kind) {
    return D.groups.filter(function (g) { return g.kind === kind && g.name !== '직책 섬김이'; })
      .sort(function (a, b) { return (a.order || 99) - (b.order || 99); }).map(function (g) { return g.name; });
  }

  function renderEdit(m) {
    var head = '<header class="detail-hero sub-hero"><button class="back" data-back="1" aria-label="뒤로">' +
      '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 6l-6 6 6 6"/></svg></button>' +
      '<div class="sub-title">교우 카드 편집</div><div class="sub-note">' + esc(m.name) + (m.saint ? ' ' + esc(m.saint) : '') + ' · ' + esc(m.id) + '</div>' +
      '<button class="ef-top-save" data-save="1" disabled>저장</button></header>';
    if (EDIT && EDIT.key === m.key && EDIT.raw) { screen.innerHTML = head + editForm(); syncSave(); return; }
    screen.innerHTML = head + '<div class="loading">시트에서 지금 값을 읽는 중입니다…</div>';
    EDIT = { key: m.key, id: m.id, raw: null, vals: {} };
    google.script.run.withSuccessHandler(function (r) {
      if (typeof r === 'string') r = JSON.parse(r);
      if (!EDIT || EDIT.key !== m.key || state.view !== 'edit') return;
      if (!r || !r.ok) { screen.innerHTML = head + '<div class="loading">편집할 수 없습니다 (' + esc(r && r.error || '오류') + ').</div>'; return; }
      EDIT.raw = r.fields;
      Object.keys(r.fields).forEach(function (k) { EDIT.vals[k] = r.fields[k].v; });
      screen.innerHTML = head + editForm();
      syncSave();
    }).withFailureHandler(function () {
      screen.innerHTML = head + '<div class="loading">시트를 읽지 못했습니다. 잠시 후 다시 해 주십시오.</div>';
    }).apiRaw(TOKEN, m.id);
  }

  // ── 새교우 등록 (2026-11-04 Francis님): 편집 화면과 같은 칸을 빈 채로, 사진도 함께 ──
  function todayText() { var d = new Date(); return d.getFullYear() + '. ' + (d.getMonth() + 1) + '. ' + d.getDate() + '.'; }
  function nextIdGuess() {
    var max = 0;
    D.members.forEach(function (m) { var x = /^SW-(\d{4})$/.exec(m.id || ''); if (x) max = Math.max(max, Number(x[1])); });
    return 'SW-' + ('000' + (max + 1)).slice(-4);
  }
  function renderNew() {
    if (!EDIT || !EDIT.isNew) {
      EDIT = { key: '__new', id: '', isNew: true, raw: {}, vals: {}, photo: '' };
      EDIT_SECTIONS.forEach(function (sec) { sec.fields.forEach(function (f) { EDIT.raw[f[0]] = { v: '', auto: false }; }); });
      EDIT.vals = { status: '출석', registered: '?', regDate: todayText(), memo: '새교우' };
    }
    screen.innerHTML = '<header class="detail-hero sub-hero"><button class="back" data-back="1" aria-label="뒤로">' +
      '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 6l-6 6 6 6"/></svg></button>' +
      '<div class="sub-title">새교우 등록</div><div class="sub-note">교적번호는 저장할 때 다음 번호로 매겨집니다 (예상 ' + esc(nextIdGuess()) + ')</div>' +
      '<button class="ef-top-save" data-save="1" disabled>등록</button></header>' + editForm();
    syncSave();
  }
  function photoCard() {
    var ok = EDIT.vals.photoOk === '예';
    return '<section class="card"><h3>사진</h3>' +
      (EDIT.photo ? '<div class="np-preview"><img alt="" src="data:image/jpeg;base64,' + EDIT.photo + '"></div>' : '') +
      '<label class="ef-btn np-pick">' + (EDIT.photo ? '사진 바꾸기' : '사진 찍기 · 고르기') +
      '<input type="file" accept="image/*" data-newphoto="1" hidden></label>' +
      (EDIT.photo ? ' <button type="button" class="ef-btn ghost" data-photoclr="1">사진 빼기</button>' : '') +
      '<div class="pm-note">' + (ok ? '저장하면 「교인사진」 폴더에 교적번호 이름으로 들어갑니다.' : '<span class="pm-warn">사진사용 동의가 「예」여야 사진을 저장합니다.</span>') + '</div></section>';
  }
  // 사진은 폰에서 줄여(긴 쪽 800px) 보낸다
  document.addEventListener('change', function (ev) {
    var el = ev.target;
    if (!EDIT || !EDIT.isNew || !el.dataset || !el.dataset.newphoto || !el.files || !el.files[0]) return;
    var fr = new FileReader();
    fr.onload = function () {
      var img = new Image();
      img.onload = function () {
        var k = Math.min(1, 800 / Math.max(img.width, img.height));
        var c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        EDIT.photo = c.toDataURL('image/jpeg', 0.85).split(',')[1];
        redrawEdit();
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(el.files[0]);
  });

  function saveNew(force) {
    var vals = {};
    Object.keys(EDIT.vals).forEach(function (k) { var v = String(EDIT.vals[k] || '').trim(); if (v) vals[k] = v; });
    if (!vals.name) { alert('성명을 넣어 주십시오.'); return; }
    if (EDIT.photo && vals.photoOk !== '예') { alert('사진사용 동의가 「예」일 때만 사진을 저장합니다.\n동의를 「예」로 고치시거나 사진을 빼 주십시오.'); return; }
    if (!force && !confirm(vals.name + (vals.saint ? ' ' + vals.saint : '') + '님을 새교우로 등록하시겠습니까?')) return;
    document.querySelectorAll('[data-save]').forEach(function (b) { b.disabled = true; b.textContent = '등록하는 중…'; });
    google.script.run.withSuccessHandler(function (r) {
      if (typeof r === 'string') r = JSON.parse(r);
      if (r && r.dup) {
        syncSave();
        if (confirm('같은 이름의 교우가 이미 있습니다.\n\n' + r.dup.join('\n') + '\n\n다른 분이 맞으면 「확인」을 눌러 등록합니다.')) saveNew(true);
        return;
      }
      if (!r || !r.ok) { syncSave(); alert('등록하지 못했습니다: ' + (r && r.error || '오류')); return; }
      EDIT = null;
      alert(r.id + '로 등록했습니다.' + (r.notes && r.notes.length ? '\n\n' + r.notes.join('\n') : ''));
      state.view = 'detail'; state.key = r.key;
      load(true);
    }).withFailureHandler(function () {
      syncSave();
      alert('연결이 원활하지 않아 등록하지 못했습니다. 잠시 후 다시 해 주십시오.');
    }).apiCreate(TOKEN, vals, EDIT.photo || '', !!force);
  }

  // 시트의 Y·N을 화면에서는 「예·아니오」로 보인다 (시트 값은 그대로, 2026-11-03 Francis님)
  function yn(v) { return v === 'Y' ? '예' : v === 'N' ? '아니오' : v; }
  function optList(opts, v) {
    if (v && opts.indexOf(v) < 0) opts = opts.concat([v]);
    return opts.map(function (o) { return '<option' + (o === v ? ' selected' : '') + ' value="' + esc(o) + '">' + (o ? esc(yn(o)) : '— 비움 —') + '</option>'; }).join('');
  }

  function editField(f) {
    var k = f[0], label = f[1], type = f[2] || '', ph = f[3] || '';
    if (!EDIT.raw[k]) return '';
    var v = EDIT.vals[k] || '';
    var changed = !EDIT.isNew && v !== EDIT.raw[k].v;  // 새교우 등록에서는 「고침」 표시를 하지 않음
    var wrap = function (inner, wide) {
      return '<div class="ef' + (wide ? ' wide' : '') + (type === 'fam' ? ' famf' : '') + (changed ? ' changed' : '') + '"><label class="ef-k">' + esc(label) + (changed ? ' <span class="ef-mark">고침</span>' : '') + '</label>' + inner + '</div>';
    };
    if (EDIT.raw[k].auto) return wrap('<div class="ef-auto">' + (v ? esc(v) : '—') + ' <span>(자동 계산)</span></div>');
    if (Array.isArray(type)) return wrap('<select class="ef-in" data-f="' + k + '">' + optList(type, v) + '</select>');
    if (type === 'sex') return wrap('<select class="ef-in" data-f="' + k + '">' + optList(['', '남', '여'], v) + '</select>');
    if (type === 'age') return wrap('<select class="ef-in" data-f="' + k + '">' + optList([''].concat(groupNames('연령단체')), v) + '</select>');
    if (type.indexOf('one:') === 0) return wrap('<select class="ef-in" data-f="' + k + '">' + optList([''].concat(groupNames(type.slice(4))), v) + '</select>');
    if (type.indexOf('multi:') === 0) {
      var on = splitList(v), names = groupNames(type.slice(6));
      on.forEach(function (x) { if (names.indexOf(x) < 0) names.push(x); });
      return wrap('<div class="ef-chips">' + names.map(function (n) {
        return '<button type="button" class="pick' + (on.indexOf(n) >= 0 ? ' on' : '') + '" data-tog="' + k + '|' + esc(n) + '">' + esc(n) + '</button>';
      }).join('') + '</div>', true);
    }
    if (type === 'fam') {
      return wrap('<div class="ef-fam">' + (v ? '<span class="ef-famv">' + esc(v) + '</span>' : '<span class="v-empty">비어 있음</span>') +
        '<button type="button" class="ef-btn" data-famset="' + k + '">' + (v ? '바꾸기' : '넣기') + '</button>' +
        (v ? '<button type="button" class="ef-btn ghost" data-famclr="' + k + '">빼기</button>' : '') + '</div>');
    }
    if (type === 'sibs') {
      var items = splitList(v);
      return wrap('<div class="ef-sibs">' + items.map(function (x, i) {
        return '<div class="ef-fam"><span class="ef-famv">' + esc(x) + '</span><button type="button" class="ef-btn ghost" data-sibdel="' + i + '">빼기</button></div>';
      }).join('') + '<button type="button" class="ef-btn" data-famset="siblings">형제자매 더하기</button></div>', true);
    }
    if (type === 'area') return wrap('<textarea class="ef-in" rows="3" data-f="' + k + '">' + esc(v) + '</textarea>', true);
    return wrap('<input class="ef-in" data-f="' + k + '" value="' + esc(v) + '" placeholder="' + esc(ph ? '예: ' + ph : '') + '">', ['address', 'email', 'sponsor'].indexOf(k) >= 0);
  }

  function editChanges() {
    var out = {};
    Object.keys(EDIT.raw || {}).forEach(function (k) {
      if (EDIT.raw[k].auto) return;
      var a = String(EDIT.raw[k].v || '').trim(), b = String(EDIT.vals[k] || '').trim();
      if (a !== b) out[k] = { from: a, to: b };
    });
    return out;
  }

  function editForm() {
    var n = Object.keys(editChanges()).length;
    return '<div class="edit-note">' + (EDIT.isNew ? '출석 상태·교적 등재·등록일·메모(「새교우」)는 미리 채워 두었습니다. 가족을 넣으면 상대편 칸도 함께 고쳐집니다. 등록 내역은 「수정 기록」에 남습니다.'
        : '가족을 넣거나 빼면 상대편 칸도 함께 고쳐집니다. 고친 내역은 모두 「수정 기록」에 남습니다.') + '</div>' +
      EDIT_SECTIONS.map(function (sec, si) {
        return (EDIT.isNew && si === 1 ? photoCard() : '') + '<section class="card' + (sec.title === '소속' || sec.title === '가족' || sec.title === '메모' ? ' wide-card' : '') + '"><h3>' + sec.title + '</h3><div class="ef-grid">' +
          sec.fields.map(editField).join('') + '</div></section>';
      }).join('') +
      '<div class="edit-bar"><button type="button" class="ef-cancel" data-back="1">취소</button>' +
      '<button type="button" class="ef-save" data-save="1"' + (n ? '' : ' disabled') + '>' + saveLabel(n) + '</button></div>';
  }

  function saveLabel(n) {
    if (EDIT && EDIT.isNew) return String(EDIT.vals.name || '').trim() ? '등록' : '성명을 넣어 주십시오';
    return n ? n + '칸 저장' : '바뀐 칸 없음';
  }
  function syncSave() {
    var n = EDIT && EDIT.raw ? Object.keys(editChanges()).length : 0;
    if (EDIT && EDIT.isNew) n = String(EDIT.vals.name || '').trim() ? 1 : 0;
    var btn = document.querySelector('.edit-bar .ef-save'), top = document.querySelector('.ef-top-save');
    if (btn) { btn.disabled = !n; btn.textContent = saveLabel(n); }
    if (top) { top.disabled = !n; top.textContent = EDIT && EDIT.isNew ? '등록' : (n ? n + '칸 저장' : '저장'); }
  }
  function redrawEdit() {
    var y = window.scrollY;
    if (EDIT && EDIT.isNew) { renderNew(); window.scrollTo(0, y); return; }
    var m = byKey[EDIT.key];
    if (m) renderEdit(m);
    window.scrollTo(0, y);
  }

  // 입력하면 값만 기억하고, 저장 단추 글자만 바꾼다 (입력 중 화면을 다시 그리지 않음)
  document.addEventListener('input', function (ev) {
    var el = ev.target;
    if (!EDIT || !el.dataset || !el.dataset.f) return;
    EDIT.vals[el.dataset.f] = el.value;
    var wrapEl = el.closest('.ef');
    var changed = !EDIT.isNew && el.value.trim() !== String(EDIT.raw[el.dataset.f].v || '').trim();
    if (wrapEl) wrapEl.classList.toggle('changed', changed);
    syncSave();
  });
  document.addEventListener('change', function (ev) {
    if (EDIT && ev.target.dataset && ev.target.dataset.f && ev.target.tagName === 'SELECT') redrawEdit();
  });

  function openFamPicker(k) {
    var el = document.createElement('div');
    el.className = 'sheet-back';
    el.innerHTML = '<div class="sheet" role="dialog" aria-label="가족 고르기">' +
      '<div class="sheet-head"><span>가족 고르기</span><button class="sheet-close" data-famclose="1" aria-label="닫기">✕</button></div>' +
      '<div class="sheet-body"><input class="ef-in fam-q" placeholder="이름, 신명, 교적번호로 찾기"><div class="fam-results"></div></div></div>';
    document.body.appendChild(el);
    el.dataset.slot = k;
    var q = el.querySelector('.fam-q'), box = el.querySelector('.fam-results');
    var draw = function () {
      var t = norm(q.value);
      var self = EDIT.id;
      var hits = D.members.filter(function (m) { return m.id && m.id !== self && (!t || norm(m.name + m.saint + m.id).indexOf(t) >= 0 || m._cho.indexOf(t) === 0); })
        .sort(byName).slice(0, 60);
      box.innerHTML = hits.map(function (m) {
        return '<button class="row" data-pickfam="' + esc(famLabel(m)) + '">' + avatar(m.name, m.photoId, 'md') +
          '<div class="row-main"><div class="row-name">' + esc(m.name) + (m.saint ? '<span class="row-saint">' + esc(m.saint) + '</span>' : '') + '</div>' +
          '<div class="row-sub"><span class="txt">' + esc(m.id) + (m.status && m.status !== '출석' ? ' · ' + esc(m.status) : '') + '</span></div></div></button>';
      }).join('') || '<div class="empty">찾는 분이 없습니다.</div>';
      wirePhotos();
    };
    q.addEventListener('input', draw);
    el.addEventListener('click', function (ev) { if (ev.target === el) el.remove(); });
    draw();
    setTimeout(function () { q.focus(); }, 50);
  }

  function editClick(el, ds) {
    if (!EDIT) return false;
    if (ds.tog) {
      var p = ds.tog.split('|'), k = p[0], n = p.slice(1).join('|');
      var on = splitList(EDIT.vals[k]);
      var i = on.indexOf(n);
      if (i >= 0) on.splice(i, 1); else on.push(n);
      EDIT.vals[k] = on.join(', ');
      redrawEdit();
      return true;
    }
    if (ds.famset) { openFamPicker(ds.famset); return true; }
    if (ds.famclr) { EDIT.vals[ds.famclr] = ''; redrawEdit(); return true; }
    if (ds.sibdel) { var s = splitList(EDIT.vals.siblings); s.splice(Number(ds.sibdel), 1); EDIT.vals.siblings = s.join(', '); redrawEdit(); return true; }
    if (ds.famclose) { el.closest('.sheet-back').remove(); return true; }
    if (ds.pickfam) {
      var back = el.closest('.sheet-back'), slot = back.dataset.slot;
      if (slot === 'siblings') {
        var list = splitList(EDIT.vals.siblings);
        if (list.indexOf(ds.pickfam) < 0) list.push(ds.pickfam);
        EDIT.vals.siblings = list.join(', ');
      } else EDIT.vals[slot] = ds.pickfam;
      back.remove();
      redrawEdit();
      return true;
    }
    if (ds.photoclr) { EDIT.photo = ''; redrawEdit(); return true; }
    if (ds.save) { if (EDIT.isNew) saveNew(false); else saveEdit(el); return true; }
    return false;
  }

  function saveEdit(btn) {
    var changes = editChanges();
    if (!Object.keys(changes).length) return;
    document.querySelectorAll('[data-save]').forEach(function (b) { b.disabled = true; b.textContent = '저장하는 중…'; });
    google.script.run.withSuccessHandler(function (r) {
      if (typeof r === 'string') r = JSON.parse(r);
      if (!r || !r.ok) { syncSave(); alert('저장하지 못했습니다: ' + (r && r.error || '오류')); return; }
      var msg = [];
      if (r.saved.length) msg.push('저장했습니다: ' + r.saved.join(', '));
      if (r.conflicts.length) msg.push('그사이 시트에서 다른 분이 고친 칸이라 저장하지 않았습니다: ' + r.conflicts.join(', '));
      (r.notes || []).forEach(function (x) { msg.push(x); });
      var key = EDIT.key;
      EDIT = null;
      if (msg.length) alert(msg.join('\n\n'));
      state.view = 'detail'; state.key = key;
      load(true);
    }).withFailureHandler(function () {
      syncSave();
      alert('연결이 원활하지 않아 저장하지 못했습니다. 잠시 후 다시 해 주십시오.');
    }).apiSave(TOKEN, EDIT.id, changes);
  }


  // ── 랜덤 교우에게 기도 문자 (2026-11-03 Francis님) ──
  // 문구를 고칠 수 있고, 「보내시겠습니까?」 확인 뒤 폰의 문자 앱을 연다. 실제 보내기는 문자 앱에서 한 번 더 누른다.
  function prayText(m, pray) {
    // 받는 분도 「성명 신명님」으로 부른다 (2026-11-03 Francis님)
    var who = m.name + (m.saint ? ' ' + m.saint : '');
    if (!pray) return who + '님, 안녕하세요? ' + (D.me || '수원교회') + '입니다. 주님 안에서 늘 평안하시길 빕니다.';
    return who + '님, 안녕하세요? ' + (D.me || '수원교회') + '입니다. 교우님을 잠시 떠올리며 하느님께 기도드렸습니다. 주님 안에서 늘 평안하시길 빕니다.';
  }
  function openPrayMsg(m, pray) {
    var tel = String(m.phone || '').replace(/[^0-9+]/g, '');
    var el = document.createElement('div');
    el.className = 'sheet-back';
    el.innerHTML = '<div class="sheet" role="dialog" aria-label="문자 안부">' +
      '<div class="sheet-head"><span>' + esc(m.name) + '님께 문자 안부</span><button class="sheet-close" data-prayclose="1" aria-label="닫기">✕</button></div>' +
      '<div class="sheet-body">' +
      '<div class="pm-to">' + (tel ? '받는 번호: <b>' + esc(m.phone) + '</b>' : '<span class="pm-warn">교적부에 휴대폰 번호가 없습니다. 「다른 앱으로 보내기」로 카톡 등에 보낼 수 있습니다.</span>') + '</div>' +
      '<textarea class="ef-in pm-text" rows="6">' + esc(prayText(m, pray)) + '</textarea>' +
      '<div class="pm-note">문구는 자유롭게 고치셔도 됩니다.</div>' +
      '<div class="pm-btns"><button class="ef-cancel" data-prayclose="1">취소</button>' +
      (tel ? '<button class="ef-save" data-praysend="' + esc(tel) + '">문자 보내기</button>' : '<button class="ef-save" data-prayshare="1">다른 앱으로 보내기</button>') +
      '</div></div></div>';
    document.body.appendChild(el);
    el.addEventListener('click', function (ev) { if (ev.target === el) el.remove(); });
  }
  function prayClick(el, ds) {
    if (ds.pray) { var m = byKey[ds.pray]; if (m) openPrayMsg(m, ds.kindMsg === 'pray'); return true; }
    if (ds.prayclose) { el.closest('.sheet-back').remove(); return true; }
    if (ds.praysend || ds.prayshare) {
      var back = el.closest('.sheet-back'), text = back.querySelector('.pm-text').value.trim();
      if (!text) return true;
      if (!confirm(ds.praysend ? '문자를 보내시겠습니까?' : '다른 앱으로 보내시겠습니까?')) return true;
      back.remove();
      if (ds.praysend) location.href = 'sms:' + ds.praysend + '?&body=' + encodeURIComponent(text);
      else shareText(text);
      return true;
    }
    return false;
  }

  // ── 화면 고르기와 뒤로 가기 (F-06) ──
  // view: list(탭 첫 화면) · detail · kind · group · servants · stat · care
  function render() {
    renderTabs();
    document.body.classList.toggle('editing', state.view === 'edit' || state.view === 'new');
    if (state.view !== 'new' && EDIT && EDIT.isNew) EDIT = null;  // 편집 중에는 아래 탭을 숨김 (폰 자판이 가리지 않게)
    if (!D) return;
    var v = state.view, k = state.key;
    if (v === 'detail' && byKey[k]) return renderDetail(byKey[k]);
    if (v === 'edit' && byKey[k] && D.canEdit) return renderEdit(byKey[k]);
    if (v === 'new' && D.canEdit) return renderNew();
    if (v === 'kind') return renderKind(k);
    if (v === 'group') return renderGroup(k);
    if (v === 'servants') return renderServants(k);
    if (v === 'stat') return renderStatList(k);
    if (v === 'care' && ADMIN) return renderCareList(k);
    if (state.tab === 'search') return renderList();
    if (state.tab === 'groups') return renderGroupsHome();
    if (state.tab === 'stats' && ADMIN) return renderStats();
    if (state.tab === 'care' && ADMIN) return renderCare();
    if (state.tab === 'random') {
      var pick = byKey[state.lastRandom] || pickRandom();
      if (pick) return renderDetail(pick, { random: true });
      screen.innerHTML = '<div class="soon">출석 교우가 없습니다.</div>';
      return;
    }
    state.tab = 'search';
    renderList();
  }

  var scrolls = {};
  function where() { return state.tab + '|' + state.view + '|' + state.key; }
  function go(patch, push) {
    scrolls[where()] = window.scrollY;
    Object.assign(state, patch);
    if (push !== false) {
      try {
        google.script.history.push({ tab: state.tab, view: state.view, key: state.key }, null, state.tab + '/' + (state.key || ''));
      } catch (e) {}
    }
    render();
    window.scrollTo(0, push === false ? (scrolls[where()] || 0) : 0);
  }

  try {
    google.script.history.setChangeHandler(function (e) {
      var s = e.state || { tab: 'groups', view: 'list', key: '' };
      go({ tab: s.tab || 'groups', view: s.view || 'list', key: s.key || '' }, false);
    });
  } catch (e) {}

  document.addEventListener('click', function (ev) {
    var el = ev.target.closest('button, [data-stat]');  // 그래프 고리·띠도 눌러서 명단 (2026-11-03)
    if (!el) return;
    var ds = el.dataset;
    if (ds.edit) go({ view: 'edit', key: ds.edit });
    else if (ds.newmember) go({ view: 'new', key: '' });
    else if (prayClick(el, ds)) return;
    else if (editClick(el, ds)) return;
    else if (ds.go) go({ view: 'detail', key: ds.go });
    else if (ds.back) history.back();
    else if (ds.tab) { if (ds.tab === 'random') state.lastRandom = ''; go({ tab: ds.tab, view: 'list', key: '' }); }
    else if (ds.cond) { var kv = ds.cond.split('='); state[kv[0]] = kv[1]; renderList(); }
    else if (ds.share) shareText(ds.share);
    else if (ds.picker) openPicker();
    else if (ds.grpx) { state.group = ''; renderList(); }
    else if (ds.reset) { state.q = ''; state.sex = '전체'; state.group = ''; state.talent = ''; renderList(); }
    else if (ds.tx) { state.talent = ''; renderList(); }
    else if (ds.tpicker) openTalentPicker();
    else if (ds.clear) { state.q = ''; renderList(); document.getElementById('q').focus(); }
    else if (ds.refresh) load(true);
    else if (ds.random) { pickRandom(); go({ view: 'list', key: '' }, false); }
    else if (ds.servants) go({ view: 'servants', key: ds.servants === '1' ? '' : ds.servants });
    else if (ds.kind) go({ view: 'kind', key: ds.kind });
    else if (ds.group) go({ tab: state.tab === 'search' || state.tab === 'random' ? 'groups' : state.tab, view: 'group', key: ds.group });
    else if (ds.stat) go({ view: 'stat', key: ds.stat });
    else if (ds.care) go({ view: 'care', key: ds.care });
  });

  renderTabs();
  load(false);
})();

  }
})();
</script>
</body>
</html>
