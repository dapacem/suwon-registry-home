<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>수원교회 교적부 G</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="대한성공회 수원교회 교적부 (허락된 분만 들어갈 수 있습니다)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="교적부 G">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1A5276">
<meta property="og:type" content="website">
<meta property="og:title" content="수원교회 교적부 G">
<meta property="og:description" content="대한성공회 수원교회 교적부">
<meta property="og:image" content="https://dapacem.github.io/suwon-registry-home/og.jpg">
<meta property="og:url" content="https://dapacem.github.io/suwon-registry-home/">
<style>
  html, body { margin: 0; height: 100%; background: #1A5276; }
  body { font-family: Arial, sans-serif; color: #fff; }
  #splash { min-height: 100%; display: flex; align-items: center; justify-content: center; text-align: center; padding: 1.5rem; box-sizing: border-box; }
  #splash img { width: 112px; height: 112px; border-radius: 24px; border: 3px solid rgba(255,255,255,.9); object-fit: cover; }
  .church { margin-top: 1rem; font-size: .9rem; opacity: .85; }
  h1 { margin: .3rem 0 1.4rem; font-size: 1.4rem; }
  .btn { display: inline-block; background: #fff; color: #1A5276; font-weight: 700; text-decoration: none; padding: .8rem 1.6rem; border-radius: .8rem; }
  .note { margin-top: 1rem; font-size: .8rem; opacity: .75; line-height: 1.6; }
  /* 교적부 본 앱을 화면 가득 띄운다. 맨 위는 아이폰 상태 표시줄 자리 */
  #app { position: fixed; left: 0; right: 0; bottom: 0; top: env(safe-area-inset-top); width: 100%;
         height: calc(100% - env(safe-area-inset-top)); border: 0; background: #F4F6F9; display: none; }
</style>
</head>
<body>
  <div id="splash">
    <div>
      <img src="apple-touch-icon.png" alt="수원교회">
      <div class="church">대한성공회 수원교회</div>
      <h1>교적부 G</h1>
      <a class="btn" href="https://script.google.com/macros/s/AKfycbyu0OxtAoA_pmqRxqeV77BdY4mg0d-Jc6gVxrI5l3AnTpO1z97xMS9LLwOX0T3C3Ww2xw/exec" target="_top">교적부 열기</a>
      <div class="note">허락된 구글 계정으로만 들어갈 수 있습니다.<br>처음 한 번, 이 화면에서 「홈 화면에 추가」를 해 두십시오.</div>
    </div>
  </div>
  <iframe id="app" title="수원교회 교적부" allow="clipboard-write"></iframe>
  <script>
  // 출입증(t): 입구 앱이 #t=… 로 돌려준다. 이 기기에만 보관하고, 만료 시각이 지나면 버린다.
  (function () {
    var MAIN = 'https://script.google.com/macros/s/AKfycbzyco2se9LOR2OZ05kgbzJAb00qyVkZPieN0bpNwOquLBlk5pFw_92bLdN-8hr1lp0/exec';
    var KEY = 'suwon-registry-pass';
    function expOf(t) {
      try {
        var p = t.split('.')[0].replace(/-/g, '+').replace(/_/g, '/');
        while (p.length % 4) p += '=';
        var s = decodeURIComponent(escape(atob(p)));
        return Number(s.slice(s.lastIndexOf('|') + 1)) || 0;
      } catch (e) { return 0; }
    }
    function save(t) { try { localStorage.setItem(KEY, t); } catch (e) {} }
    function load() { try { return localStorage.getItem(KEY) || ''; } catch (e) { return ''; } }
    function drop() { try { localStorage.removeItem(KEY); } catch (e) {} }

    var m = location.hash.match(/[#&]t=([^&]+)/);
    var t = m ? decodeURIComponent(m[1]) : load();
    if (m) { save(t); history.replaceState(null, '', location.pathname); }
    if (t && expOf(t) > Date.now() + 60000) {
      var f = document.getElementById('app');
      f.src = MAIN + '?t=' + encodeURIComponent(t);
      f.style.display = 'block';
      document.getElementById('splash').style.display = 'none';
    } else if (t) { drop(); }

    // 본 앱이 출입증이 끝났다고 알려 오면 처음 화면으로
    window.addEventListener('message', function (e) {
      if (e.data === 'suwon-registry-expired') { drop(); location.replace(location.pathname); }
    });
  })();
  </script>
</body>
</html>
